[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    dataset: requires the extracted pinned Multi-config dataset
    gpu: requires a CUDA-capable GPU
    slow: long-running integration or benchmark test
filterwarnings =
    ignore::pyparsing.PyparsingDeprecationWarning:matplotlib.*
    ignore:builtin type SwigPy.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning
